[pytest]
testpaths = tests
# Debugging one test:   pytest tests/test_x.py -k name
# Quick run (no real models, a few minutes):   pytest -m "not slow"
# Parallel (needs a machine with plenty of RAM; 3 workers crashed Postgres on an 8 GB laptop):   pytest -n 2 --dist loadfile
addopts = -p no:cacheprovider
markers =
    slow: runs the real embedding model, reranker and exams end to end (minutes); skip with -m "not slow"
