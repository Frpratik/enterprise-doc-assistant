# Local infrastructure for development.
#   start:  docker compose up -d
#   stop:   docker compose down          (data is kept in the volumes)
#   reset:  docker compose down -v       (deletes all data)
services:
  postgres:
    image: pgvector/pgvector:pg16          # Postgres 16 with the pgvector extension built in
    container_name: eda-postgres
    environment:
      POSTGRES_USER: eda
      POSTGRES_PASSWORD: eda_local_pw      # local development only
      POSTGRES_DB: eda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eda -d eda"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:                                   # used in Stage 7 (background jobs)
    image: redis:7-alpine
    container_name: eda-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
